name: Deploy dashboard to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/azure-static-web-apps.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Hybrid Next.js: app_location is the project dir; leave output_location empty.
          app_location: "dashboard"
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_DEMO_MODE: ${{ vars.DEMO_MODE }}
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
