bundle:
  name: market-stream

variables:
  node_type:
    description: VM size for the streaming cluster
    default: Standard_D4s_v3
  spark_version:
    description: Databricks Runtime (verify with `databricks clusters spark-versions`)
    default: 17.3.x-scala2.13

resources:
  jobs:
    market_stream_pipeline:
      name: market-stream-pipeline
      max_concurrent_runs: 1

      job_clusters:
        - job_cluster_key: stream_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
              # Long-running streaming on one node: give driver RPCs (incl. the
              # state-store coordinator) headroom so a transient stall doesn't
              # trip the 120s default and abort the run. See last-failure logs.
              spark.rpc.askTimeout: "300s"
              spark.network.timeout: "300s"
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: stream
          job_cluster_key: stream_cluster
          notebook_task:
            notebook_path: ./notebooks/pipeline.py
          libraries:
            - pypi:
                package: azure-cosmos

      # Continuous trigger keeps the run alive and restarts it from the
      # checkpoint on failure (transient RPC/Kafka timeouts self-heal).
      # Single-environment bundle: the target below sets no `mode`, so this
      # UNPAUSED value is honored literally and the trigger runs live.
      continuous:
        pause_status: UNPAUSED

targets:
  # Single environment (matches the single-env infra). No `mode` preset, so
  # no [dev user] name prefix and no forced trigger-pause — `bundle deploy`
  # deploys the live continuous job directly. Stop it between demos with
  # `scripts\pipeline.ps1 stop` (nothing auto-pauses it).
  default:
    default: true
    workspace:
      host: https://adb-7405615183315554.14.azuredatabricks.net
